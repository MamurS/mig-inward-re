# Supabase CLI config (used for local dev / self-hosted moves).
# Linked remote project: mig-inward-re, ref jltrtqwaxvsrnqmjemzc.
# NEVER link/push to tci_erp (reunqrpeumokqgarknge) or mosaic-erp-production (onppnfyoffhyaxemsqoz).
project_id = "mig-inward-re"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 5000

[db]
port = 54322
major_version = 17

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
# Internal system: users are created by an admin, never by self sign-up.
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = false
